packages:
  - packages/*
  - apps/*
  - tests/fixtures/*

# Internal deps are pinned to exact reserved versions (0.1.0-next.1) so the
# packed manifests declare exact pins; those versions are not on the
# registry yet, so link them to the workspace projects instead.
linkWorkspacePackages: true
allowBuilds:
  # Native binaries pnpm would otherwise refuse to run.
  esbuild: true
  '@biomejs/biome': true

# Several agents run scripts concurrently; never let `pnpm run` trigger an
# implicit install (that rewrites the shared lockfile). Install explicitly.
verifyDepsBeforeRun: false
