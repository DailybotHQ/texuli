packages:
  - packages/*
  - apps/*
  - tests/fixtures/*

# Internal deps are pinned to exact versions (0.5.0) so the packed
# manifests declare exact pins; link them to the workspace projects
# instead of the registry.
linkWorkspacePackages: true
allowBuilds:
  # Native binaries pnpm would otherwise refuse to run.
  esbuild: true
  '@biomejs/biome': true

# Several agents run scripts concurrently; never let `pnpm run` trigger an
# implicit install (that rewrites the shared lockfile). Install explicitly.
verifyDepsBeforeRun: false
