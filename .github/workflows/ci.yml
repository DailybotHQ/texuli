# Texuli CI (docs/CI.md).
#
# Required checks on every push to main and every pull request:
#   - check:     lint, typecheck, unit + component tests, layers, supply
#                chain, docs links, agent skill.
#   - behavior:  the primitives behavior suite on chromium and webkit
#                (phone rows run in a Pixel 7 context inside chromium).
#   - website:   the website build (which runs `astro check`) plus the
#                browser e2e suite except the budget tests, in six shards.
#   - audits:    size budgets and the site-perf budgets (docs/CI.md).
#   - setup-smoke-macos: the skill's setup.sh under macOS /bin/bash 3.2.
#
# Only on pushes to main, never required (continue-on-error):
#   - mcp-remote-smoke: after the Cloudflare Pages deploy of the same
#                commit, a read-only tools/list against https://texuli.com/mcp
#                must equal the registry (scripts/mcp-remote-smoke.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, layers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history, so tests and scripts that read git (size revisions,
      # check-docs) see the same repository as a local clone.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec tsx scripts/supply-chain.ts
      - run: pnpm exec tsx scripts/check-docs.ts
      - run: pnpm check:skill
      # The skill's only shell script; shellcheck ships on the Ubuntu image.
      - run: shellcheck skills/texuli/setup.sh

  behavior:
    name: Behavior suite (chromium, webkit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image ships the browsers and their system libraries for
    # the pinned @playwright/test version: no apt step, whose mirror stalled
    # jobs for 10-22 minutes.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      # The workspace belongs to the runner user, the container runs as root.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: TEXULI_E2E_PORT=4870 pnpm exec playwright test tests/behavior
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: behavior-test-results
          path: test-results
          retention-days: 5

  website:
    name: Website build and site checks (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image ships the browsers and their system libraries for
    # the pinned @playwright/test version: no apt step, whose mirror stalled
    # jobs for 10-22 minutes.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    # Six runners each build the site and run one shard of the same e2e
    # suite. tests/e2e/shards.json deals the specs by measured CI time (about
    # 1.5 minutes of tests per shard); scripts/tests/e2e-shards.test.ts
    # fails when a spec is in no shard or in two.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # Full history: the sitemap's lastmod comes from each page's git log.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The workspace belongs to the runner user, the container runs as root.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @texuli/website check:csp
        if: matrix.shard == 1
      # The site-perf budget tests ("performance budgets") run in the
      # audits job below, not here.
      - name: E2E shard ${{ matrix.shard }}
        run: >-
          TEXULI_E2E_PORT=4870 pnpm exec playwright test
          $(node -p "require('./tests/e2e/shards.json').shards[${{ matrix.shard }} - 1].map((f) => 'tests/e2e/' + f).join(' ')")
          --project chromium --grep-invert "performance budgets"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: website-test-results-${{ matrix.shard }}
          path: test-results
          retention-days: 5

  audits:
    name: Budget audits (size and site-perf)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Playwright's image ships the browsers and their system libraries for
    # the pinned @playwright/test version: no apt step, whose mirror stalled
    # jobs for 10-22 minutes.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7
      # The workspace belongs to the runner user, the container runs as root.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm size
      # Run even when pnpm size is red, so site-perf is actually measured.
      - run: pnpm build
        if: success() || failure()
      - run: TEXULI_E2E_PORT=4870 pnpm exec playwright test tests/e2e/site-perf.spec.ts --project chromium
        if: success() || failure()
      - name: Report
        if: always()
        run: |
          {
            echo "## Budget audit"
            echo ""
            echo "pnpm size and the site-perf budgets carry no tracked reds (owner budget rows applied 2026-10-26)."
            echo "A failure here is a regression: shrink the code; raise a budget only as an owner decision with a reason (docs/CI.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  setup-smoke-macos:
    name: Skill setup.sh smoke (macOS /bin/bash 3.2)
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # macOS ships bash 3.2 as /bin/bash; setup.sh promises to run there.
      - name: Confirm /bin/bash is 3.2
        run: /bin/bash --version | head -n 1 | grep 'version 3\.2'
      - name: Verify the pack, install into every host, re-run idempotently
        run: |
          set -eu
          SETUP=skills/texuli/setup.sh
          /bin/bash "$SETUP" --help > /dev/null
          VERSION=$(/bin/bash "$SETUP" --version)
          /bin/bash "$SETUP" --verify --expect-version "$VERSION"
          HOME_DIR=$(mktemp -d)
          /bin/bash "$SETUP" --list-hosts > "$HOME_DIR/hosts.txt"
          while read -r host folder; do
            /bin/bash "$SETUP" --host "$host" --home "$HOME_DIR" --expect-version "$VERSION" --dry-run
            /bin/bash "$SETUP" --host "$host" --home "$HOME_DIR" --expect-version "$VERSION"
            /bin/bash "$SETUP" --host "$host" --home "$HOME_DIR" | grep 'Already installed: no change.'
            /bin/bash "$SETUP" --verify --dir "$HOME_DIR/${folder#\~/}" --expect-version "$VERSION"
          done < "$HOME_DIR/hosts.txt"

  # The remote MCP (functions/mcp.ts) deploys with the site, outside GitHub
  # Actions, so this job polls until the deploy of this commit serves the
  # registry's tools: a read-only tools/list with curl, compared with the
  # committed server card (generated from the registry; pnpm check:surfaces
  # keeps them equal). It retries for up to 10 minutes. It never runs on
  # pull requests and never fails the workflow (continue-on-error), so a
  # slow deploy cannot block publishing; a drift shows as a failed job with
  # an error annotation.
  mcp-remote-smoke:
    name: Remote MCP matches the registry (main, after deploy)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # curl and jq ship on the Ubuntu image; nothing is installed.
      - run: bash scripts/mcp-remote-smoke.sh
        env:
          MCP_SMOKE_ATTEMPTS: '20'
          MCP_SMOKE_DELAY: '30'
