# Texuli CI (docs/CI.md).
#
# Required checks on every push to main and every pull request:
#   - check:     lint, typecheck, unit + component tests, layers, supply
#                chain, docs links, agent skill.
#   - behavior:  the primitives behavior suite on chromium, webkit and
#                mobile (the suite's three projects).
#   - website:   the website build (which runs `astro check`) plus the
#                browser e2e suite except the budget tests.
#   - audits:    size budgets and the site-perf budgets, allowed to fail
#                while the tracked pre-existing reds stand (docs/CI.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit tests, layers
    runs-on: ubuntu-latest
    steps:
      # Full history: packages/tokens/tests/library-quality.test.ts reads the
      # pre-compact library port from git (5c682dd^).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec tsx scripts/supply-chain.ts
      - run: pnpm exec tsx scripts/check-docs.ts
      - run: pnpm check:skill

  behavior:
    name: Behavior suite (chromium, webkit, mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: TEXULI_E2E_PORT=4870 pnpm exec playwright test tests/behavior
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: behavior-test-results
          path: test-results
          retention-days: 5

  website:
    name: Website build and site checks
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap's lastmod comes from each page's git log.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm --filter @texuli/website check:csp
      # The site-perf budget tests ("performance budgets") run in the
      # audits job below, not here.
      - run: >-
          TEXULI_E2E_PORT=4870 pnpm exec playwright test tests/e2e
          --project chromium --grep-invert "performance budgets"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: website-test-results
          path: test-results
          retention-days: 5

  audits:
    name: Budget audits (tracked pre-existing reds)
    runs-on: ubuntu-latest
    # pnpm size carries documented reds (docs/CI.md); site-perf passed
    # 10/10 locally on 2026-10-26. They run here so the drift stays visible
    # without blocking merges; fixing the size reds retires this tolerance.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm size
      # Run even when pnpm size is red, so site-perf is actually measured.
      - run: pnpm build
        if: success() || failure()
      - run: TEXULI_E2E_PORT=4870 pnpm exec playwright test tests/e2e/site-perf.spec.ts --project chromium
        if: success() || failure()
      - name: Report
        if: always()
        run: |
          {
            echo "## Budget audit (allowed to fail)"
            echo ""
            echo "Tracked reds, documented in docs/CI.md (local run 2026-10-26):"
            echo "- pnpm size: 19 no-budget rows (@texuli/astro, player, slides, spec) and 7 over-budget rows (catalog, catalog/manifests/content, catalog/player, catalog/render/hostile, catalog/validate, charts/math, data/grid-editing); budget rows are an owner decision."
            echo "- site-perf: no tracked reds (10/10 passed locally after T-91/T-92)."
            echo ""
            echo "A NEW failure here is a regression — fix it, do not raise a budget."
          } >> "$GITHUB_STEP_SUMMARY"
