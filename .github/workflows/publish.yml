# Publishes the packable packages to npm (docs/RELEASE.md).
#
# Trigger: a `v*` tag push, or a manual workflow_dispatch run against a
# branch. The job rebuilds every tarball from source with
# `pnpm verify:packages` (publint-strict, byte checks), then publishes the
# freshly packed tarballs in the documented wave order with `--tag next`,
# then points `latest` at the same versions: until 1.0.0, `latest` tracks
# the newest preview, so npm's package page shows the current README and a
# bare install gets the current preview (owner decision 2026-10-27).
#
# Requires one repository secret:
#   NPM_TOKEN — a granular access token of the publishing account with
#   read-and-write on the @texuli packages. CI tokens bypass 2FA OTP.
#
# Tarballs ship with npm provenance (signed, linked to this repository and
# workflow through GitHub's OIDC token — the `id-token: write` permission).
name: Publish packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Pack, verify and publish (dist-tag next)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      # Packs the tarballs into tmp/packages/tarballs/ and records
      # SHA-256 digests; publint warnings fail the job.
      - run: pnpm verify:packages
      - name: Publish in wave order (docs/RELEASE.md)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          publish() {
            local dir="$1" name version slug tarball
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            slug=${name#@}; slug=${slug//\//-}
            tarball="tmp/packages/tarballs/${slug}-${version}.tgz"
            test -s "$tarball"
            # Idempotent: a re-run after a partial failure skips what is
            # already on the registry (a published version never changes).
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${name}@${version}: already on npm"
              return 0
            fi
            echo "Publishing ${name}@${version} (${tarball})"
            # The provenance step reads a GitHub OIDC token, which can fail
            # transiently (IDENTITY_TOKEN_READ_ERROR, run 40506123596), so
            # retry before failing the wave.
            local attempt
            for attempt in 1 2 3; do
              if npm publish "$tarball" --tag next --access public --provenance; then
                return 0
              fi
              # A failed attempt may still have landed; never publish twice.
              if npm view "${name}@${version}" version >/dev/null 2>&1; then
                return 0
              fi
              echo "Attempt ${attempt} for ${name}@${version} failed; retrying"
              sleep $((attempt * 15))
            done
            return 1
          }
          # Wave 174 — the L0 texels and the L2 token engine.
          publish packages/core
          publish packages/date
          # L0 packages that later waves depend on: catalog and player import the
          # spec; primitives, data and workflows import the drag engine.
          publish packages/spec
          publish packages/drag
          publish packages/tokens
          # Wave 175 — L1 headless primitives.
          publish packages/primitives
          # Wave 176 — L3 styled components.
          publish packages/texuli
          # L4: the workflow editor, after texuli and before the player.
          publish packages/workflows
          # Wave 177 — L4 domain packages.
          publish packages/charts
          publish packages/data
          publish packages/media
          publish packages/chat
          publish packages/blocks
          # Wave 178 — L6/L7 and the newer surfaces.
          publish packages/catalog
          publish packages/tools
          publish packages/astro
          publish packages/player
          publish packages/slides
          echo "All packable packages published under dist-tag next."
      - name: Point latest at this release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in core date spec drag tokens primitives texuli workflows charts data media chat blocks catalog tools astro player slides; do
            name=$(node -p "require('./packages/${dir}/package.json').name")
            version=$(node -p "require('./packages/${dir}/package.json').version")
            npm dist-tag add "${name}@${version}" latest
          done
      - name: Record digests
        run: cat tmp/packages/SHA256SUMS
